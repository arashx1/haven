<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="havenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="45%" stop-color="#E5944E" />
      <stop offset="100%" stop-color="#BC5E1E" />
    </linearGradient>
    <linearGradient id="highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#5C3015" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Rounded Squircle Badge -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#havenGradient)" filter="url(#softGlow)" />
  
  <!-- Subtle Top Rim Reflection -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="14.5" fill="none" stroke="url(#highlight)" stroke-width="1.5" />

  <!-- Bold, Friendly 'H' Emblem for Haven -->
  <path d="
    M 20.5,15
    C 22.4,15 24,16.6 24,18.5
    L 24,28
    L 40,28
    L 40,18.5
    C 40,16.6 41.6,15 43.5,15
    C 45.4,15 47,16.6 47,18.5
    L 47,45.5
    C 47,47.4 45.4,49 43.5,49
    C 41.6,49 40,47.4 40,45.5
    L 40,36
    L 24,36
    L 24,45.5
    C 24,47.4 22.4,49 20.5,49
    C 18.6,49 17,47.4 17,45.5
    L 17,18.5
    C 17,16.6 18.6,15 20.5,15
    Z"
    fill="#FFFFFF"
  />

  <!-- Subtle Caring Hearth / Heart Accent on the crossbar -->
  <path d="M 32,29.5 C 30.2,27.5 27.5,28.8 27.5,31 C 27.5,32.8 32,35.5 32,35.5 C 32,35.5 36.5,32.8 36.5,31 C 36.5,28.8 33.8,27.5 32,29.5 Z" fill="#BC5E1E" />
</svg>
